services:
  babel:
    image: therealshadoh/babel:latest
    container_name: babel
    ports:
      - "8686:8686"
    volumes:
      - babel-data:/app/data
      # Optional: mount media for ffprobe fallback
      # - /mnt/user/media:/media:ro
    environment:
      # Point these at your Sonarr/Plex host, not localhost — "localhost" inside
      # the container refers to the container itself, not your LAN.
      - SONARR_URL=http://your-server:8989
      - SONARR_API_KEY=
      - PLEX_URL=http://your-server:32400
      - PLEX_TOKEN=
      - SCAN_INTERVAL_HOURS=6
      - TARGET_LANGUAGE=eng
      # Hung-mount hardening. Every probe is bounded, and at most
      # FFPROBE_MAX_CONCURRENT ffprobe processes can be stuck on a dead mount
      # at once. Raise the timeouts for very slow storage.
      # - FFPROBE_TIMEOUT=30
      # - FFPROBE_MAX_CONCURRENT=4
      # Hard-exit if the event loop stalls this long (seconds); 0 disables.
      # - WATCHDOG_ABORT_LAG=300
      # Match the data volume's ownership to your host user (defaults to 1000:1000)
      # - PUID=1000
      # - PGID=1000
      # Optional: gate the whole dashboard behind HTTP Basic Auth
      # - AUTH_USERNAME=
      # - AUTH_PASSWORD=
      # Optional: require ?apikey= on the Sonarr webhook endpoint
      # - WEBHOOK_SECRET=
    # Docker never restarts a container merely because it is *unhealthy* —
    # `restart: unless-stopped` reacts only to the process exiting. Babel's
    # in-process watchdog covers that gap by hard-exiting when the event loop
    # stalls past WATCHDOG_ABORT_LAG, which this policy then restarts.
    restart: unless-stopped
    # Belt and braces: the image already runs tini as PID 1, but this also
    # applies if the entrypoint is overridden or an older tag is pinned.
    init: true

volumes:
  babel-data:
