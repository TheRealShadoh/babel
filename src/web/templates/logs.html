{% extends "base.html" %}
{% block title %}Logs{% endblock %}
{% block content %}
<div class="page-header">
    <h1>Logs</h1>
    <div style="display:flex;gap:0.3rem;">
        <button class="btn btn-sm btn-primary" data-log-level="" aria-pressed="true" onclick="loadLogs('')">All</button>
        <button class="btn btn-sm" style="background:rgba(59,130,246,0.12);color:var(--blue);border:1px solid rgba(59,130,246,0.3);" data-log-level="INFO" aria-pressed="false" onclick="loadLogs('INFO')">Info</button>
        <button class="btn btn-sm" style="background:rgba(245,158,11,0.12);color:var(--yellow);border:1px solid rgba(245,158,11,0.3);" data-log-level="WARNING" aria-pressed="false" onclick="loadLogs('WARNING')">Warning</button>
        <button class="btn btn-sm" style="background:rgba(244,63,94,0.12);color:var(--red);border:1px solid rgba(244,63,94,0.3);" data-log-level="ERROR" aria-pressed="false" onclick="loadLogs('ERROR')">Error</button>
    </div>
</div>
<div class="card" style="padding:0.5rem;max-height:70vh;overflow-y:auto;" id="log-content"
     hx-get="/api/logs" hx-trigger="load, every 10s" hx-swap="innerHTML"
     hx-vals="js:{level: window.currentLogLevel || ''}">
    Loading...
</div>
<script>
// htmx reads hx-get once when it processes the element, so changing the
// attribute later does nothing and the 10s refresh kept fetching unfiltered
// logs. hx-vals is evaluated on every request, so the level lives there.
window.currentLogLevel = '';
function loadLogs(level) {
    window.currentLogLevel = level || '';
    document.querySelectorAll('[data-log-level]').forEach(function (b) {
        b.setAttribute('aria-pressed', b.getAttribute('data-log-level') === window.currentLogLevel ? 'true' : 'false');
    });
    htmx.trigger('#log-content', 'load');
}
</script>
{% endblock %}
