services:
  babel:
    build: .
    container_name: babel
    ports:
      - "8686:8686"
    volumes:
      - babel-data:/app/data
      # Mount media for ffprobe fallback
      # - /mnt/user/media:/media:ro
    environment:
      # Point these at your Sonarr/Plex host, not localhost — "localhost" inside
      # the container refers to the container itself, not your host machine.
      - SONARR_URL=http://your-server:8989
      - SONARR_API_KEY=
      - PLEX_URL=http://your-server:32400
      - PLEX_TOKEN=
      - SCAN_INTERVAL_HOURS=6
      - TARGET_LANGUAGE=eng
    # Docker never restarts a container merely because it is *unhealthy* —
    # `restart: unless-stopped` reacts only to the process exiting. Babel's
    # in-process watchdog covers that gap by hard-exiting when the event loop
    # stalls past WATCHDOG_ABORT_LAG, which this policy then restarts.
    restart: unless-stopped
    # Belt and braces: the image already runs tini as PID 1, but this also
    # applies if the entrypoint is overridden or an older tag is pinned.
    init: true

volumes:
  babel-data:
